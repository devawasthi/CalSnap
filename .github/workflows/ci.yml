name: Validate CalSnap
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -s backend/maven-settings.xml -f backend/pom.xml verify
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator docs/openapi.json
      - run: docker build -f render/Dockerfile -t calsnap-render:ci .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: docker compose up -d --build
      - run: for i in $(seq 1 90); do curl -fsS http://localhost:8080/health && break; sleep 2; done; curl -fsS http://localhost:8080/health
      - run: ./scripts/seed.sh
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: browser-diagnostics, path: "frontend/test-results/
              compose.log" }
